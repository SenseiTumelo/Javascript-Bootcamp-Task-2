<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Pass/Fail Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Student Grade Checker</h1>
            <form id="gradeForm">
                <div class="form-group">
                    <label for="studentName">Student Name:</label>
                    <input 
                        type="text" 
                        id="studentName" 
                        name="studentName" 
                        placeholder="Enter student name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentMark">Student Mark:</label>
                    <input 
                        type="number" 
                        id="studentMark" 
                        name="studentMark" 
                        placeholder="Enter mark (0-100)"
                        min="0"
                        max="100"
                        required
                    >
                </div>

                <button type="submit" class="btn">Check Result</button>
            </form>

            <div id="result" class="result hidden">
                <div id="resultContent"></div>
            </div>

            <div id="studentsList" class="students-list hidden">
                <h2>Submitted Students</h2>
                <ol id="studentsListContent">
                </ol>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
